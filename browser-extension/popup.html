<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="popup.css">
<title>Buzz — تفريغ فيديو يوتيوب</title>
<body>
  <header><span class="logo" aria-hidden="true">●</span><div><b>Buzz</b><small>حوّل الفيديو إلى نص</small></div></header>
  <main>
    <h1 id="heading">جارٍ بدء التفريغ…</h1>
    <p id="status" role="status" aria-live="polite">جارٍ إرسال الفيديو إلى Buzz.</p>
    <progress id="progress" max="100" aria-label="نسبة التفريغ"></progress>
    <p class="hint" id="hint">يمكنك إغلاق هذه النافذة. سيفتح النص تلقائيًا عند اكتماله.</p>
    <button id="retry" hidden>إعادة المحاولة</button>
  </main>
  <footer>يُستخدم النموذج واللغة المحفوظان في Buzz.<br>تُحسب تكلفة API وفق حسابك لدى مزوّد الخدمة، إن كنت تستخدمه.</footer>
  <script src="popup.js"></script>
</body>
</html>
