<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="popup.css">
<title>Buzz — تفريغ يوتيوب</title>
<body>
  <header><span class="logo" aria-hidden="true">●</span><div><b>Buzz</b><small>من الفيديو للنص</small></div></header>
  <main>
    <h1 id="heading">جارٍ بدء التفريغ…</h1>
    <p id="status" role="status" aria-live="polite">بنوصّل الفيديو بـBuzz.</p>
    <progress id="progress" max="100" aria-label="نسبة التفريغ"></progress>
    <p class="hint" id="hint">تقدر تقفل النافذة. النص هيفتح تلقائيًا لما يخلص.</p>
    <button id="retry" hidden>إعادة المحاولة</button>
  </main>
  <footer>بنفس الموديل واللغة المحفوظين في Buzz.<br>تكلفة الـAPI حسب حسابك، لو بتستخدمه.</footer>
  <script src="popup.js"></script>
</body>
</html>
